version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hydroharvest_postgres
    environment:
      POSTGRES_DB: hydroharvestdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hydroharvestdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./hydro-harvest-backend
      dockerfile: Dockerfile
    container_name: hydroharvest_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hydroharvestdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./hydro-harvest-frontend
      dockerfile: Dockerfile
    container_name: hydroharvest_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: