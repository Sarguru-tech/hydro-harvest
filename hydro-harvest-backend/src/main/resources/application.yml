server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hydro-harvest-backend

  main:
    lazy-initialization: true

  datasource:
    url: jdbc:h2:mem:hydroharvestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret}
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never